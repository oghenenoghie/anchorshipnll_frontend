<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">Wärtsilä W32 cylinder head — exploded view</title>
  <rect x="0" y="0" width="1200" height="900" fill="#F4F2EC" />

  <!-- central exploded-view axis -->
  <line x1="600" y1="80" x2="600" y2="800" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.6" />

  <!-- 01 rocker cover -->
  <path d="M 470 130 L 730 130 Q 760 130 760 165 L 760 190 L 440 190 L 440 165 Q 440 130 470 130 Z"
        fill="none" stroke="#2E6E9E" stroke-width="2.5" />
  <line x1="760" y1="150" x2="900" y2="140" stroke="#8A97A6" stroke-width="1.25" stroke-dasharray="3 5" />

  <!-- 02 cylinder head body -->
  <rect x="380" y="260" width="440" height="180" rx="14" fill="none" stroke="#2E6E9E" stroke-width="2.5" />
  <circle cx="450" cy="260" r="14" fill="none" stroke="#2E6E9E" stroke-width="2" />
  <circle cx="530" cy="260" r="14" fill="none" stroke="#2E6E9E" stroke-width="2" />
  <circle cx="670" cy="260" r="14" fill="none" stroke="#2E6E9E" stroke-width="2" />
  <circle cx="750" cy="260" r="14" fill="none" stroke="#2E6E9E" stroke-width="2" />
  <line x1="400" y1="440" x2="800" y2="440" stroke="#2E6E9E" stroke-width="1.5" opacity="0.4" />
  <line x1="820" y1="330" x2="920" y2="330" stroke="#8A97A6" stroke-width="1.25" stroke-dasharray="3 5" />

  <!-- 03 head gasket -->
  <rect x="380" y="470" width="440" height="22" rx="4" fill="none" stroke="#2E6E9E" stroke-width="2" />
  <circle cx="450" cy="481" r="5" fill="#2E6E9E" />
  <circle cx="530" cy="481" r="5" fill="#2E6E9E" />
  <circle cx="670" cy="481" r="5" fill="#2E6E9E" />
  <circle cx="750" cy="481" r="5" fill="#2E6E9E" />
  <line x1="380" y1="480" x2="300" y2="470" stroke="#8A97A6" stroke-width="1.25" stroke-dasharray="3 5" />

  <!-- 04 exhaust valve -->
  <line x1="600" y1="560" x2="600" y2="690" stroke="#2E6E9E" stroke-width="10" stroke-linecap="round" />
  <ellipse cx="600" cy="705" rx="52" ry="14" fill="none" stroke="#2E6E9E" stroke-width="2.5" />
  <line x1="560" y1="640" x2="300" y2="660" stroke="#8A97A6" stroke-width="1.25" stroke-dasharray="3 5" />
</svg>
